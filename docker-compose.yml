services:
  postgres:
    image: postgres:16-alpine
    container_name: kss-whatsapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kss
      POSTGRES_PASSWORD: kss_password
      POSTGRES_DB: kss_whatsapp
    ports:
      - "5432:5432"
    volumes:
      - kss_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kss -d kss_whatsapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kss_postgres_data:
